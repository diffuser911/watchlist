<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackList</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 16px; max-width: 600px; margin: 0 auto; }
    
    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .top-title-group { display: flex; align-items: baseline; gap: 8px; }
    .top-bar h1 { font-size: 22px; font-weight: bold; }
    .version-badge { color: #38bdf8; font-size: 11px; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; border: 1px solid #333; }
    .top-actions { display: flex; gap: 6px; }

    /* Tabs */
    .tabs { display: flex; background: #1e1e1e; border-radius: 8px; padding: 3px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 8px; text-align: center; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 13px; }
    .tab.active { background: #333; color: #fff; }

    /* Search & Filter Rows */
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; }
    input[type="text"]:focus { outline: none; border-color: #555; }
    button.btn-search { background: #e50914; color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .dropdown { background: #222; border-radius: 8px; margin-bottom: 12px; overflow: hidden; border: 1px solid #333; }
    .drop-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #2e2e2e; cursor: pointer; align-items: center; }
    .drop-item:active { background: #2a2a2a; }
    
    /* Controls Bar */
    .controls-panel { margin-bottom: 12px; }
    .status-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
    .status-pills::-webkit-scrollbar { display: none; }
    .pill { background: #1e1e1e; border: 1px solid #333; color: #888; padding: 5px 12px; border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .pill.active { background: #e50914; border-color: #e50914; color: #fff; }

    .sub-controls { display: flex; gap: 8px; align-items: center; }
    .view-toggle { background: #1e1e1e; border: 1px solid #333; color: #aaa; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }

    /* Standard Card */
    .card-container { background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; overflow: hidden; border: 1px solid #2a2a2a; }
    .card { display: flex; gap: 12px; padding: 12px; align-items: flex-start; cursor: pointer; }
    .poster { width: 55px; height: 80px; object-fit: cover; border-radius: 4px; background: #2a2a2a; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .title { font-weight: bold; font-size: 15px; margin-bottom: 3px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 4px; }
    .progress-text { color: #38bdf8; font-size: 12px; font-weight: 500; margin-top: 4px; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .tag { background: #2a2a2a; color: #38bdf8; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .btn-action { background: #262626; border: 1px solid #383838; color: #aaa; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .btn-action:hover { color: #fff; }
    .btn-watched { background: #14532d; color: #4ade80; border-color: #15803d; }
    .btn-cal { background: #0369a1; color: #fff; text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; display: inline-block; margin-top: 5px; }
    .delete-btn { color: #ff5555; background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; margin-left: 6px; }

    /* Compact List Layout */
    .compact-mode .card { padding: 8px 10px; align-items: center; }
    .compact-mode .poster { width: 36px; height: 50px; }
    .compact-mode .sub, .compact-mode .tags, .compact-mode .btn-cal { display: none; }
    .compact-mode .title { font-size: 13px; margin-bottom: 0; }

    /* TV Episode Inline Accordion */
    .episodes-panel { background: #161616; border-top: 1px solid #2d2d2d; padding: 8px 12px; }
    .season-block { margin-bottom: 8px; border-bottom: 1px solid #222; }
    .season-block:last-child { border-bottom: none; }
    
    /* Collapsible Season Header */
    .season-header { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 10px 4px; cursor: pointer; user-select: none; 
    }
    .season-title-group { display: flex; align-items: center; gap: 6px; }
    .season-title { color: #fbbf24; font-size: 13px; font-weight: bold; }
    .season-indicator { font-size: 11px; color: #777; transition: transform 0.2s; }
    .season-actions { display: flex; align-items: center; gap: 8px; }
    .season-stats { font-size: 11px; color: #888; }
    .bulk-btn { color: #94a3b8; font-size: 11px; text-decoration: underline; background: none; border: none; cursor: pointer; }
    
    .season-episodes-list { padding: 4px 0 10px 0; }
    .episode-row { display: flex; align-items: center; padding: 7px 4px; border-bottom: 1px solid #1c1c1c; font-size: 13px; }
    .episode-checkbox { width: 26px; text-align: center; color: #888; font-weight: bold; font-size: 15px; cursor: pointer; }
    .episode-checkbox.watched { color: #4ade80; }
    .episode-label { flex: 1; margin-left: 6px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .episode-label.watched { color: #666; text-decoration: line-through; }
    .star-btn { background: none; border: none; font-size: 17px; cursor: pointer; color: #555; padding: 0 6px; }
    .star-btn.active { color: #facc15; }
  </style>
  <script src="./config.js"></script>
</head>
<body>

  <!-- Hidden native file input -->
  <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-title-group">
      <h1>TrackMyWatchList</h1>
      <span class="version-badge">v2.5</span>
    </div>
    <div class="top-actions">
      <button type="button" class="btn-action" onclick="exportBackup()">📥 Export</button>
      <button type="button" class="btn-action" onclick="triggerImport()">📤 Import</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button type="button" class="tab active" id="tab-watchlist" onclick="switchTab('watchlist')">My Watchlist</button>
    <button type="button" class="tab" id="tab-tv" onclick="switchTab('tv')">Add TV Shows</button>
    <button type="button" class="tab" id="tab-movie" onclick="switchTab('movie')">Add Movies</button>
  </div>

  <!-- Search Panel (TV & Movie Tabs only) -->
  <div id="searchSection" style="display:none;">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search..." onkeydown="if(event.key==='Enter') searchOnline()">
      <button type="button" class="btn-search" onclick="searchOnline()">Search</button>
    </div>
    <div id="searchResults" class="dropdown" style="display:none;"></div>
  </div>

  <!-- Watchlist Filter & Controls Panel -->
  <div id="controlsSection" class="controls-panel">
    <div class="status-pills">
      <button type="button" class="pill active" onclick="setStatusFilter('all')">All</button>
      <button type="button" class="pill" onclick="setStatusFilter('watching')">📺 Watching</button>
      <button type="button" class="pill" onclick="setStatusFilter('to_watch')">🍿 To Watch</button>
      <button type="button" class="pill" onclick="setStatusFilter('favorites')">⭐ Favorites</button>
      <button type="button" class="pill" onclick="setStatusFilter('completed')">✓ Finished</button>
    </div>

    <div class="sub-controls">
      <input type="text" id="filterInput" placeholder="Filter by title, genre, director, actor..." oninput="renderDisplay()">
      <button type="button" class="view-toggle" id="viewToggleBtn" onclick="toggleViewMode()">☰ Compact</button>
    </div>
  </div>

  <!-- Content Heading & List -->
  <h3 id="listHeading" style="color:#aaa; font-size:13px; margin-bottom:8px;">Saved Items</h3>
  <div id="itemsContainer"></div>

  <script>
    const ACTIVE_OMDB_KEY = (typeof OMDB_API_KEY !== 'undefined') ? OMDB_API_KEY : "YOUR_OMDB_KEY";

    let currentTab = 'watchlist'; 
    let currentStatusFilter = 'all'; 
    let isCompactView = false;
    let expandedShowId = null;
    let expandedSeasons = {}; // Tracks open/closed seasons: { "showId_sNum": boolean }
    let currentSearchResults = [];
    let watchlist = [];

    function normalizeWatchlist(items) {
      if (!Array.isArray(items)) return [];
      return items.map(item => {
        const normalized = {
          ...item,
          id: String(item.id),
          watched: item.watched === true,
        };
        if (normalized.type === 'tv' && Array.isArray(normalized.seasons)) {
          normalized.seasons = normalized.seasons.map(s => ({
            ...s,
            episodes: (s.episodes || []).map(ep => ({
              ...ep,
              id: String(ep.id),
              watched: ep.watched === true,
              favorite: ep.favorite === true
            }))
          }));
        }
        return normalized;
      });
    }

    try {
      const rawStored = localStorage.getItem('tracklist_items_v2') || localStorage.getItem('tracklist_items') || '[]';
      watchlist = normalizeWatchlist(JSON.parse(rawStored));
    } catch (e) {
      console.warn("Storage initial load:", e);
      watchlist = [];
    }

    function save() {
      try {
        localStorage.setItem('tracklist_items_v2', JSON.stringify(watchlist));
      } catch (e) {
        console.error("Save error:", e);
      }
      renderDisplay();
    }

    window.switchTab = function(tab) {
      currentTab = tab;
      ['watchlist', 'tv', 'movie'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (btn) btn.className = (t === tab) ? 'tab active' : 'tab';
      });

      const searchSection = document.getElementById('searchSection');
      const controlsSection = document.getElementById('controlsSection');
      const searchInput = document.getElementById('searchInput');
      const resBox = document.getElementById('searchResults');

      if (searchInput) searchInput.value = '';
      if (resBox) {
        resBox.innerHTML = '';
        resBox.style.display = 'none';
      }
      currentSearchResults = [];

      if (tab === 'watchlist') {
        if (searchSection) searchSection.style.display = 'none';
        if (controlsSection) controlsSection.style.display = 'block';
      } else {
        if (searchSection) searchSection.style.display = 'block';
        if (controlsSection) controlsSection.style.display = 'none';
        if (searchInput) {
          searchInput.placeholder = `Search ${tab === 'tv' ? 'TV shows' : 'movies'} online...`;
          searchInput.focus();
        }
      }

      renderDisplay();
    };

    window.setStatusFilter = function(status) {
      currentStatusFilter = status;
      const pills = document.querySelectorAll('.status-pills .pill');
      const labels = ['all', 'watching', 'to_watch', 'favorites', 'completed'];
      pills.forEach((p, idx) => {
        if (p) p.className = (labels[idx] === status) ? 'pill active' : 'pill';
      });
      renderDisplay();
    };

    window.toggleViewMode = function() {
      isCompactView = !isCompactView;
      const btn = document.getElementById('viewToggleBtn');
      if (btn) btn.textContent = isCompactView ? '▤ Detailed' : '☰ Compact';
      renderDisplay();
    };

    window.searchOnline = async function() {
      const q = (document.getElementById('searchInput')?.value || '').trim();
      if (!q) { renderDisplay(); return; }

      const resBox = document.getElementById('searchResults');
      resBox.innerHTML = '<div style="padding:12px; color:#888;">Searching...</div>';
      resBox.style.display = 'block';

      try {
        if (currentTab === 'tv') {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          currentSearchResults = data.map(d => ({
            id: String(d.show.id),
            name: d.show.name,
            type: 'tv'
          }));
          renderDropdown(currentSearchResults);
        } else {
          let titleQuery = q;
          let yearQuery = '';
          const yearMatch = q.match(/\b(19\d\d|20\d\d)\b/);
          if (yearMatch) {
            yearQuery = `&y=${yearMatch[0]}`;
            titleQuery = q.replace(yearMatch[0], '').trim();
          }

          const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(titleQuery)}${yearQuery}&type=movie&apikey=${ACTIVE_OMDB_KEY}`);
          const data = await res.json();
          if (data.Response === 'True') {
            currentSearchResults = data.Search.map(m => ({
              id: String(m.imdbID),
              name: `${m.Title} (${m.Year})`,
              rawTitle: m.Title,
              type: 'movie'
            }));
            renderDropdown(currentSearchResults);
          } else {
            const exactRes = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(titleQuery)}${yearQuery}&type=movie&apikey=${ACTIVE_OMDB_KEY}`);
            const exactData = await exactRes.json();
            if (exactData.Response === 'True') {
              currentSearchResults = [{
                id: String(exactData.imdbID),
                name: `${exactData.Title} (${exactData.Year})`,
                rawTitle: exactData.Title,
                type: 'movie'
              }];
              renderDropdown(currentSearchResults);
            } else {
              resBox.innerHTML = '<div style="padding:12px; color:#888;">No results found.</div>';
            }
          }
        }
      } catch (err) {
        console.error(err);
        resBox.innerHTML = '<div style="padding:12px; color:#ff5555;">Search failed. Verify network.</div>';
      }

      renderDisplay();
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function renderDropdown(items) {
      const box = document.getElementById('searchResults');
      if (!items.length) {
        box.innerHTML = '<div style="padding:12px; color:#888;">No results found.</div>';
        return;
      }

      box.innerHTML = items.slice(0, 8).map((item, index) => `
        <div class="drop-item" onclick="addItemByIndex(${index})">
          <span>${escapeHtml(item.name)}</span>
          <span style="color:#4ade80; font-weight:bold;">+ Add</span>
        </div>
      `).join('');
    }

    window.addItemByIndex = async function(index) {
      const item = currentSearchResults[index];
      if (!item) return;

      if (watchlist.some(w => String(w.id) === String(item.id))) {
        alert('Already in your list!');
        return;
      }

      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('searchInput').value = '';

      try {
        if (item.type === 'movie') {
          const res = await fetch(`https://www.omdbapi.com/?i=${item.id}&plot=short&apikey=${ACTIVE_OMDB_KEY}`);
          const d = await res.json();
          watchlist.push({
            id: String(item.id),
            type: 'movie',
            name: d.Title || item.rawTitle,
            year: d.Year || '',
            director: d.Director || 'N/A',
            actors: d.Actors || 'N/A',
            genres: d.Genre ? d.Genre.split(', ') : [],
            image: d.Poster && d.Poster !== 'N/A' ? d.Poster : '',
            watched: false
          });
        } else {
          const epRes = await fetch(`https://api.tvmaze.com/shows/${item.id}/episodes`);
          const rawEpisodes = await epRes.json();

          const seasonsMap = {};
          rawEpisodes.forEach(ep => {
            const sNum = ep.season;
            if (!seasonsMap[sNum]) seasonsMap[sNum] = { season: sNum, episodes: [] };
            seasonsMap[sNum].episodes.push({
              id: String(ep.id),
              name: ep.name || `Episode ${ep.number}`,
              number: ep.number,
              season: ep.season,
              watched: false,
              favorite: false
            });
          });

          let nextAirDate = 'TBD';
          let nextEpisodeTitle = '';
          let nextAirStamp = null;
          try {
            const detailRes = await fetch(`https://api.tvmaze.com/shows/${item.id}?embed=nextepisode`);
            const d = await detailRes.json();
            const nextEp = d._embedded?.nextepisode;
            if (nextEp) {
              nextAirDate = nextEp.airdate || 'TBD';
              nextEpisodeTitle = nextEp.name || '';
              nextAirStamp = nextEp.airstamp || null;
            }
          } catch (e) {}

          watchlist.push({
            id: String(item.id),
            type: 'tv',
            name: item.name,
            image: rawEpisodes[0]?.image?.medium || '',
            nextAirDate,
            nextEpisodeTitle,
            nextAirStamp,
            seasons: Object.values(seasonsMap)
          });
        }

        save();
        switchTab('watchlist');
      } catch (err) {
        console.error('Failed to import item:', err);
        alert('Could not fetch details. Please try again.');
      }
    };

    window.toggleAccordion = function(id) {
      expandedShowId = (expandedShowId === String(id)) ? null : String(id);
      renderDisplay();
    };

    // Toggle specific Season accordion
    window.toggleSeasonAccordion = function(showId, seasonNum, event) {
      if (event) event.stopPropagation();
      const key = `${showId}_${seasonNum}`;
      expandedSeasons[key] = !expandedSeasons[key];
      renderDisplay();
    };

    window.toggleEpisode = function(showId, epId) {
      watchlist = watchlist.map(item => {
        if (String(item.id) !== String(showId)) return item;
        const updatedSeasons = (item.seasons || []).map(s => ({
          ...s,
          episodes: s.episodes.map(ep => String(ep.id) === String(epId) ? { ...ep, watched: !ep.watched } : ep)
        }));
        return { ...item, seasons: updatedSeasons };
      });
      save();
    };

    window.toggleEpisodeFavorite = function(showId, epId, event) {
      if (event) event.stopPropagation();
      watchlist = watchlist.map(item => {
        if (String(item.id) !== String(showId)) return item;
        const updatedSeasons = (item.seasons || []).map(s => ({
          ...s,
          episodes: s.episodes.map(ep => String(ep.id) === String(epId) ? { ...ep, favorite: !ep.favorite } : ep)
        }));
        return { ...item, seasons: updatedSeasons };
      });
      save();
    };

    window.toggleSeasonBulk = function(showId, seasonNum, markWatched, event) {
      if (event) event.stopPropagation();
      watchlist = watchlist.map(item => {
        if (String(item.id) !== String(showId)) return item;
        const updatedSeasons = (item.seasons || []).map(s => {
          if (s.season !== seasonNum) return s;
          return { ...s, episodes: s.episodes.map(ep => ({ ...ep, watched: markWatched })) };
        });
        return { ...item, seasons: updatedSeasons };
      });
      save();
    };

    window.toggleMovieWatched = function(id, event) {
      if (event) event.stopPropagation();
      watchlist = watchlist.map(item => String(item.id) === String(id) ? { ...item, watched: !item.watched } : item);
      save();
    };

    window.deleteItem = function(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('Remove this title from your list?')) return;
      watchlist = watchlist.filter(w => String(w.id) !== String(id));
      save();
    };

    function getStats(seasons = []) {
      let total = 0, watched = 0, favorites = 0;
      seasons.forEach(s => s.episodes.forEach(ep => {
        total++;
        if (ep.watched) watched++;
        if (ep.favorite) favorites++;
      }));
      return { total, watched, favorites, pct: total ? Math.round((watched / total) * 100) : 0 };
    }

    function renderDisplay() {
      const container = document.getElementById('itemsContainer');
      const heading = document.getElementById('listHeading');
      if (!container || !heading) return;
      
      let itemsToRender = [];

      if (currentTab === 'watchlist') {
        const filter = (document.getElementById('filterInput')?.value || '').toLowerCase().trim();
        itemsToRender = watchlist.filter(item => {
          if (currentStatusFilter === 'to_watch' && (item.type !== 'movie' || item.watched)) return false;
          if (currentStatusFilter === 'watching') {
            if (item.type !== 'tv') return false;
            const stats = getStats(item.seasons);
            if (stats.watched >= stats.total) return false;
          }
          if (currentStatusFilter === 'completed') {
            if (item.type === 'movie' && !item.watched) return false;
            if (item.type === 'tv') {
              const stats = getStats(item.seasons);
              if (stats.total === 0 || stats.watched < stats.total) return false;
            }
          }
          if (currentStatusFilter === 'favorites') {
            if (item.type === 'tv') {
              const stats = getStats(item.seasons);
              if (stats.favorites === 0) return false;
            } else return false;
          }

          if (!filter) return true;
          const matchName = item.name?.toLowerCase().includes(filter);
          if (item.type === 'tv') return matchName;
          return matchName ||
                 item.director?.toLowerCase().includes(filter) ||
                 item.actors?.toLowerCase().includes(filter) ||
                 item.genres?.some(g => g.toLowerCase().includes(filter));
        });

        heading.style.display = 'block';
        heading.textContent = `My Watchlist (${itemsToRender.length}${itemsToRender.length !== watchlist.length ? ` of ${watchlist.length}` : ''})`;

        if (!itemsToRender.length) {
          container.innerHTML = '<div style="color:#666; font-size:13px; padding:12px 0;">No items found matching the selected filter.</div>';
          return;
        }
      } else {
        const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
        if (!searchQuery || searchQuery.length < 2) {
          heading.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        itemsToRender = watchlist.filter(item => item.type === currentTab && item.name.toLowerCase().includes(searchQuery));

        if (!itemsToRender.length) {
          heading.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        heading.style.display = 'block';
        heading.textContent = `Already in Watchlist (${itemsToRender.length})`;
      }

      container.className = isCompactView ? 'compact-mode' : '';

      container.innerHTML = itemsToRender.map(item => {
        if (item.type === 'movie') {
          return `
            <div class="card-container">
              <div class="card">
                ${item.image ? `<img src="${escapeHtml(item.image)}" class="poster" loading="lazy">` : '<div class="poster"></div>'}
                <div class="info">
                  <div class="title">${escapeHtml(item.name)} <span style="color:#888; font-size:12px;">(${escapeHtml(item.year)})</span></div>
                  <div class="tags">
                    ${(item.genres || []).map(g => `<span class="tag">${escapeHtml(g)}</span>`).join('')}
                  </div>
                  <div class="sub">Dir: ${escapeHtml(item.director)}</div>
                  <div class="sub" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Cast: ${escapeHtml(item.actors)}</div>
                  <button type="button" class="btn-action ${item.watched ? 'btn-watched' : ''}" onclick="toggleMovieWatched('${item.id}', event)">
                    ${item.watched ? '✓ Watched' : '○ Mark as Watched'}
                  </button>
                </div>
                <button type="button" class="delete-btn" onclick="deleteItem('${item.id}', event)">✕</button>
              </div>
            </div>
          `;
        }

        const stats = getStats(item.seasons);
        const isExpanded = expandedShowId === String(item.id);

        let calLink = '';
        if (item.nextAirStamp) {
          const d = new Date(item.nextAirStamp);
          const iso = d.toISOString().replace(/-|:|\.\d\d\d/g, "");
          calLink = `<a class="btn-cal" target="_blank" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('New ' + item.name + ' Episode')}&dates=${iso}/${iso}&details=${encodeURIComponent(item.nextEpisodeTitle || 'New Episode Airing')}">📅 Calendar</a>`;
        }

        let episodesHtml = '';
        if (isExpanded && item.seasons) {
          episodesHtml = `
            <div class="episodes-panel">
              ${item.seasons.map((s, idx) => {
                const sTotal = s.episodes.length;
                const sWatched = s.episodes.filter(ep => ep.watched).length;
                const allWatched = sTotal > 0 && sWatched === sTotal;
                
                // Keep the first unfinished season open by default, or default to false
                const key = `${item.id}_${s.season}`;
                if (expandedSeasons[key] === undefined) {
                  expandedSeasons[key] = (sWatched < sTotal) && (idx === 0 || (item.seasons[idx - 1] && item.seasons[idx - 1].episodes.every(e => e.watched)));
                }
                const isSeasonOpen = !!expandedSeasons[key];

                return `
                  <div class="season-block">
                    <div class="season-header" onclick="toggleSeasonAccordion('${item.id}',${s.season}, event)">
                      <div class="season-title-group">
                        <span class="season-indicator">${isSeasonOpen ? '▼' : '▶'}</span>
                        <span class="season-title">Season ${s.season}</span>
                        <span class="season-stats">(${sWatched}/${sTotal})</span>
                      </div>
                      <div class="season-actions">
                        <button type="button" class="bulk-btn" onclick="toggleSeasonBulk('${item.id}', ${s.season},${!allWatched}, event)">
                          ${allWatched ? 'Unmark Season' : 'Watch Season'}
                        </button>
                      </div>
                    </div>
                    ${isSeasonOpen ? `
                      <div class="season-episodes-list">
                        ${s.episodes.map(ep => `
                          <div class="episode-row">
                            <span class="episode-checkbox ${ep.watched ? 'watched' : ''}" onclick="toggleEpisode('${item.id}', '${ep.id}')">
                              ${ep.watched ? '✓' : '○'}
                            </span>
                            <span class="episode-label ${ep.watched ? 'watched' : ''}" onclick="toggleEpisode('${item.id}', '${ep.id}')">
                              E${ep.number \vert{}\vert{} '-'}:${escapeHtml(ep.name)}
                            </span>
                            <button type="button" class="star-btn ${ep.favorite ? 'active' : ''}" onclick="toggleEpisodeFavorite('${item.id}', '${ep.id}', event)">
                              ${ep.favorite ? '★' : '☆'}
                            </button>
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        return `
          <div class="card-container">
            <div class="card" onclick="toggleAccordion('${item.id}')">
              ${item.image ? `<img src="${escapeHtml(item.image)}" class="poster" loading="lazy">` : '<div class="poster"></div>'}
              <div class="info">
                <div class="title">${escapeHtml(item.name)} <span style="font-size:12px; color:#38bdf8;">${isExpanded ? '▲' : '▼'}</span></div>
                <div class="sub" style="color:#38bdf8;">Next Air Date: ${escapeHtml(item.nextAirDate)}</div>
                <div class="progress-text">
                  ${stats.watched} / ${stats.total} eps (${stats.pct}%) 
                  ${stats.favorites > 0 ? `· <span style="color:#facc15;">★ ${stats.favorites}</span>` : ''}
                </div>
                ${calLink}
              </div>
              <button type="button" class="delete-btn" onclick="deleteItem('${item.id}', event)">✕</button>
            </div>
            ${episodesHtml}
          </div>
        `;
      }).join('');
    }

    window.exportBackup = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watchlist, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `watchlist_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.triggerImport = function() {
      const fileInput = document.getElementById('importFileInput');
      if (fileInput) {
        fileInput.value = '';
        fileInput.click();
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const fileInput = document.getElementById('importFileInput');
      if (fileInput) {
        fileInput.addEventListener('change', function(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function(evt) {
            try {
              const raw = JSON.parse(evt.target.result);
              if (Array.isArray(raw)) {
                watchlist = normalizeWatchlist(raw);
                save();
                alert(`Watchlist restored successfully! Loaded ${watchlist.length} items.`);
              } else {
                alert('Invalid backup structure: expected a JSON array.');
              }
            } catch (err) {
              console.error(err);
              alert('Could not parse JSON file. Ensure it is a valid backup.');
            }
          };
          reader.readAsText(file);
        });
      }

      renderDisplay();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.error('SW Error', err));
      });
    }
  </script>
</body>
</html>
