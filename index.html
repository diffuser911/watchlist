<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackList</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 16px; max-width: 600px; margin: 0 auto; }
    
    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .top-bar h1 { font-size: 22px; font-weight: bold; }
    .top-actions { display: flex; gap: 6px; }

    /* Tabs */
    .tabs { display: flex; background: #1e1e1e; border-radius: 8px; padding: 3px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 8px; text-align: center; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 13px; }
    .tab.active { background: #333; color: #fff; }

    /* Search & Filter Rows */
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; }
    input[type="text"]:focus { outline: none; border-color: #555; }
    button.btn-search { background: #e50914; color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .dropdown { background: #222; border-radius: 8px; margin-bottom: 12px; overflow: hidden; border: 1px solid #333; }
    .drop-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #2e2e2e; cursor: pointer; align-items: center; }
    .drop-item:active { background: #2a2a2a; }
    .filter-box { background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 14px; }

    /* Card & Accordion */
    .card-container { background: #1e1e1e; border-radius: 8px; margin-bottom: 12px; overflow: hidden; border: 1px solid #2a2a2a; }
    .card { display: flex; gap: 12px; padding: 12px; align-items: flex-start; cursor: pointer; }
    .poster { width: 55px; height: 80px; object-fit: cover; border-radius: 4px; background: #2a2a2a; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .title { font-weight: bold; font-size: 15px; margin-bottom: 3px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 4px; }
    .progress-text { color: #38bdf8; font-size: 12px; font-weight: 500; margin-top: 4px; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .tag { background: #2a2a2a; color: #38bdf8; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .btn-action { background: #262626; border: none; color: #aaa; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 500; }
    .btn-action:hover { color: #fff; }
    .btn-watched { background: #14532d; color: #4ade80; }
    .btn-cal { background: #0369a1; color: #fff; text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; display: inline-block; margin-top: 5px; }
    .delete-btn { color: #ff5555; background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; margin-left: 6px; }

    /* TV Seasons & Episodes */
    .episodes-panel { background: #161616; border-top: 1px solid #2d2d2d; padding: 12px; }
    .season-block { margin-bottom: 14px; }
    .season-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .season-title { color: #fbbf24; font-size: 13px; font-weight: bold; }
    .bulk-btn { color: #94a3b8; font-size: 11px; text-decoration: underline; background: none; border: none; cursor: pointer; }
    .episode-row { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #202020; font-size: 13px; }
    .episode-checkbox { width: 22px; text-align: center; color: #888; font-weight: bold; font-size: 14px; cursor: pointer; }
    .episode-checkbox.watched { color: #4ade80; }
    .episode-label { flex: 1; margin-left: 6px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .episode-label.watched { color: #666; text-decoration: line-through; }
    
    /* Favorite Star Button */
    .star-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: #555; padding: 0 6px; line-height: 1; }
    .star-btn.active { color: #facc15; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <h1>TrackList</h1>
    <div class="top-actions">
      <button class="btn-action" onclick="exportBackup()">📥 Export</button>
      <label class="btn-action" style="display:inline-flex; align-items:center;">
        📤 Import
        <input type="file" accept=".json" onchange="importBackup(event)" style="display:none;">
      </label>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-watchlist" onclick="switchTab('watchlist')">My Watchlist</button>
    <button class="tab" id="tab-tv" onclick="switchTab('tv')">Add TV Shows</button>
    <button class="tab" id="tab-movie" onclick="switchTab('movie')">Add Movies</button>
  </div>

  <!-- Search Panel (TV & Movie Tabs only) -->
  <div id="searchSection" style="display:none;">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search..." onkeydown="if(event.key==='Enter') searchOnline()">
      <button class="btn-search" onclick="searchOnline()">Search</button>
    </div>
    <div id="searchResults" class="dropdown" style="display:none;"></div>
  </div>

  <!-- Filter Panel (Watchlist Tab only) -->
  <div id="filterSection" class="filter-box">
    <input type="text" id="filterInput" placeholder="Filter by title, genre, director, actor..." oninput="renderDisplay()">
  </div>

  <!-- Content Heading & List -->
  <h3 id="listHeading" style="color:#aaa; font-size:13px; margin-bottom:8px;">Saved Items</h3>
  <div id="itemsContainer"></div>

  <script>
    const OMDB_API_KEY = "9f85df42"; // Replace with your OMDb API key
    let currentTab = 'watchlist'; // 'watchlist' | 'tv' | 'movie'
    let currentSearchResults = [];
    let expandedShowId = null;
    let watchlist = JSON.parse(localStorage.getItem('tracklist_items_v2') || '[]');

    function save() {
      localStorage.setItem('tracklist_items_v2', JSON.stringify(watchlist));
      renderDisplay();
    }

    function switchTab(tab) {
      currentTab = tab;

      ['watchlist', 'tv', 'movie'].forEach(t => {
        document.getElementById(`tab-${t}`).className = (t === tab) ? 'tab active' : 'tab';
      });

      const searchSection = document.getElementById('searchSection');
      const filterSection = document.getElementById('filterSection');
      const searchInput = document.getElementById('searchInput');
      const resBox = document.getElementById('searchResults');

      // Reset search inputs on tab switch
      searchInput.value = '';
      resBox.innerHTML = '';
      resBox.style.display = 'none';
      currentSearchResults = [];

      if (tab === 'watchlist') {
        searchSection.style.display = 'none';
        filterSection.style.display = 'block';
      } else {
        searchSection.style.display = 'block';
        filterSection.style.display = 'none';
        searchInput.placeholder = `Search ${tab === 'tv' ? 'TV shows' : 'movies'} online...`;
        searchInput.focus();
      }

      renderDisplay();
    }

    async function searchOnline() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) {
        renderDisplay();
        return;
      }

      const resBox = document.getElementById('searchResults');
      resBox.innerHTML = '<div style="padding:12px; color:#888;">Searching...</div>';
      resBox.style.display = 'block';

      try {
        if (currentTab === 'tv') {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          currentSearchResults = data.map(d => ({
            id: String(d.show.id),
            name: d.show.name,
            type: 'tv'
          }));
          renderDropdown(currentSearchResults);
        } else {
          const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&type=movie&apikey=${OMDB_API_KEY}`);
          const data = await res.json();
          if (data.Response === 'True') {
            currentSearchResults = data.Search.map(m => ({
              id: String(m.imdbID),
              name: `${m.Title} (${m.Year})`,
              rawTitle: m.Title,
              type: 'movie'
            }));
            renderDropdown(currentSearchResults);
          } else {
            const exactRes = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(q)}&type=movie&apikey=${OMDB_API_KEY}`);
            const exactData = await exactRes.json();
            if (exactData.Response === 'True') {
              currentSearchResults = [{
                id: String(exactData.imdbID),
                name: `${exactData.Title} (${exactData.Year})`,
                rawTitle: exactData.Title,
                type: 'movie'
              }];
              renderDropdown(currentSearchResults);
            } else {
              resBox.innerHTML = '<div style="padding:12px; color:#888;">No results found.</div>';
            }
          }
        }
      } catch (err) {
        console.error(err);
        resBox.innerHTML = '<div style="padding:12px; color:#ff5555;">Search failed. Verify network.</div>';
      }

      renderDisplay();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderDropdown(items) {
      const box = document.getElementById('searchResults');
      if (!items.length) {
        box.innerHTML = '<div style="padding:12px; color:#888;">No results found.</div>';
        return;
      }

      box.innerHTML = items.slice(0, 8).map((item, index) => `
        <div class="drop-item" onclick="addItemByIndex(${index})">
          <span>${escapeHtml(item.name)}</span>
          <span style="color:#4ade80; font-weight:bold;">+ Add</span>
        </div>
      `).join('');
    }

    async function addItemByIndex(index) {
      const item = currentSearchResults[index];
      if (!item) return;

      if (watchlist.some(w => String(w.id) === String(item.id))) {
        alert('Already in your list!');
        return;
      }

      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('searchInput').value = '';

      try {
        if (item.type === 'movie') {
          const res = await fetch(`https://www.omdbapi.com/?i=${item.id}&plot=short&apikey=${OMDB_API_KEY}`);
          const d = await res.json();
          watchlist.push({
            id: String(item.id),
            type: 'movie',
            name: d.Title || item.rawTitle,
            year: d.Year || '',
            director: d.Director || 'N/A',
            actors: d.Actors || 'N/A',
            genres: d.Genre ? d.Genre.split(', ') : [],
            image: d.Poster && d.Poster !== 'N/A' ? d.Poster : '',
            watched: false
          });
        } else {
          const epRes = await fetch(`https://api.tvmaze.com/shows/${item.id}/episodes`);
          const rawEpisodes = await epRes.json();

          const seasonsMap = {};
          rawEpisodes.forEach(ep => {
            const sNum = ep.season;
            if (!seasonsMap[sNum]) seasonsMap[sNum] = { season: sNum, episodes: [] };
            seasonsMap[sNum].episodes.push({
              id: String(ep.id),
              name: ep.name || `Episode ${ep.number}`,
              number: ep.number,
              season: ep.season,
              watched: false,
              favorite: false
            });
          });

          let nextAirDate = 'TBD';
          let nextEpisodeTitle = '';
          let nextAirStamp = null;
          try {
            const detailRes = await fetch(`https://api.tvmaze.com/shows/${item.id}?embed=nextepisode`);
            const d = await detailRes.json();
            const nextEp = d._embedded?.nextepisode;
            if (nextEp) {
              nextAirDate = nextEp.airdate || 'TBD';
              nextEpisodeTitle = nextEp.name || '';
              nextAirStamp = nextEp.airstamp || null;
            }
          } catch (e) {
            console.log('No next episode found');
          }

          watchlist.push({
            id: String(item.id),
            type: 'tv',
            name: item.name,
            image: rawEpisodes[0]?.image?.medium || '',
            nextAirDate,
            nextEpisodeTitle,
            nextAirStamp,
            seasons: Object.values(seasonsMap)
          });
        }

        save();
        switchTab('watchlist');
      } catch (err) {
        console.error('Failed to import:', err);
        alert('Could not fetch details. Please try again.');
      }
    }

    function toggleShowAccordion(id) {
      expandedShowId = (expandedShowId === id) ? null : id;
      renderDisplay();
    }

    function toggleEpisode(showId, epId) {
      watchlist = watchlist.map(item => {
        if (String(item.id) !== String(showId)) return item;
        const updatedSeasons = (item.seasons || []).map(s => ({
          ...s,
          episodes: s.episodes.map(ep => String(ep.id) === String(epId) ? { ...ep, watched: !ep.watched } : ep)
        }));
        return { ...item, seasons: updatedSeasons };
      });
      save();
    }

    function toggleEpisodeFavorite(showId, epId, event) {
      event.stopPropagation();
      watchlist = watchlist.map(item => {
        if (String(item.id) !== String(showId)) return item;
        const updatedSeasons = (item.seasons || []).map(s => ({
          ...s,
          episodes: s.episodes.map(ep => String(ep.id) === String(epId) ? { ...ep, favorite: !ep.favorite } : ep)
        }));
        return { ...item, seasons: updatedSeasons };
      });
      save();
    }

    function toggleSeasonBulk(showId, seasonNum, markWatched) {
      watchlist = watchlist.map(item => {
        if (String(item.id) !== String(showId)) return item;
        const updatedSeasons = (item.seasons || []).map(s => {
          if (s.season !== seasonNum) return s;
          return {
            ...s,
            episodes: s.episodes.map(ep => ({ ...ep, watched: markWatched }))
          };
        });
        return { ...item, seasons: updatedSeasons };
      });
      save();
    }

    function toggleMovieWatched(id) {
      watchlist = watchlist.map(item => String(item.id) === String(id) ? { ...item, watched: !item.watched } : item);
      save();
    }

    function deleteItem(id, event) {
      event.stopPropagation();
      if (!confirm('Remove this title from your list?')) return;
      watchlist = watchlist.filter(w => String(w.id) !== String(id));
      save();
    }

    function getStats(seasons = []) {
      let total = 0, watched = 0, favorites = 0;
      seasons.forEach(s => s.episodes.forEach(ep => {
        total++;
        if (ep.watched) watched++;
        if (ep.favorite) favorites++;
      }));
      return { total, watched, favorites, pct: total ? Math.round((watched / total) * 100) : 0 };
    }

    function renderDisplay() {
      const container = document.getElementById('itemsContainer');
      const heading = document.getElementById('listHeading');
      
      let itemsToRender = [];

      if (currentTab === 'watchlist') {
        const filter = document.getElementById('filterInput').value.toLowerCase().trim();
        itemsToRender = watchlist.filter(item => {
          if (!filter) return true;
          const matchName = item.name?.toLowerCase().includes(filter);
          if (item.type === 'tv') return matchName;
          return matchName ||
                 item.director?.toLowerCase().includes(filter) ||
                 item.actors?.toLowerCase().includes(filter) ||
                 item.genres?.some(g => g.toLowerCase().includes(filter));
        });

        heading.style.display = 'block';
        heading.textContent = `My Watchlist (${itemsToRender.length}${itemsToRender.length !== watchlist.length ? ` of ${watchlist.length}` : ''})`;

        if (!itemsToRender.length) {
          container.innerHTML = '<div style="color:#666; font-size:13px; padding:12px 0;">No items found. Tap "Add TV Shows" or "Add Movies" above.</div>';
          return;
        }
      } else {
        // Tab is 'tv' or 'movie': only show items if there are actual matches in watchlist
        const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

        // Require at least 2 characters to prevent single-letter false matches
        if (!searchQuery || searchQuery.length < 2) {
          heading.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        // Exact word or full title match check
        itemsToRender = watchlist.filter(item => {
          if (item.type !== currentTab) return false;
          const name = item.name.toLowerCase();
          // Match if user's search query matches the title or title contains the full query
          return name.includes(searchQuery);
        });

        // ONLY show the heading if items were actually found!
        if (!itemsToRender.length) {
          heading.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        heading.style.display = 'block';
        heading.textContent = `Already in Watchlist (${itemsToRender.length})`;
      }
      container.innerHTML = itemsToRender.map(item => {
        if (item.type === 'movie') {
          return `
            <div class="card-container">
              <div class="card">
                ${item.image ? `<img src="${escapeHtml(item.image)}" class="poster" loading="lazy">` : '<div class="poster"></div>'}
                <div class="info">
                  <div class="title">${escapeHtml(item.name)} <span style="color:#888; font-size:12px;">(${escapeHtml(item.year)})</span></div>
                  <div class="tags">
                    ${(item.genres || []).map(g => `<span class="tag">${escapeHtml(g)}</span>`).join('')}
                  </div>
                  <div class="sub">Dir: ${escapeHtml(item.director)}</div>
                  <div class="sub" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Cast: ${escapeHtml(item.actors)}</div>
                  <button class="btn-action ${item.watched ? 'btn-watched' : ''}" onclick="toggleMovieWatched('${item.id}')">
                    ${item.watched ? '✓ Watched' : '○ Mark as Watched'}
                  </button>
                </div>
                <button class="delete-btn" onclick="deleteItem('${item.id}', event)">✕</button>
              </div>
            </div>
          `;
        }

        // TV Show Card with Favorites support
        const stats = getStats(item.seasons);
        const isExpanded = expandedShowId === String(item.id);

        let calLink = '';
        if (item.nextAirStamp) {
          const d = new Date(item.nextAirStamp);
          const iso = d.toISOString().replace(/-|:|\.\d\d\d/g, "");
          calLink = `<a class="btn-cal" target="_blank" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('New ' + item.name + ' Episode')}&dates=${iso}/${iso}&details=${encodeURIComponent(item.nextEpisodeTitle || 'New Episode Airing')}">📅 Calendar Reminder</a>`;
        }

        let episodesHtml = '';
        if (isExpanded && item.seasons) {
          episodesHtml = `
            <div class="episodes-panel">
              ${item.seasons.map(s => {
                const allWatched = s.episodes.length > 0 && s.episodes.every(ep => ep.watched);
                return `
                  <div class="season-block">
                    <div class="season-header">
                      <span class="season-title">Season ${s.season}</span>
                      <button class="bulk-btn" onclick="toggleSeasonBulk('${item.id}', ${s.season},${!allWatched})">
                        ${allWatched ? 'Unmark Season' : 'Watch Season'}
                      </button>
                    </div>
                    ${s.episodes.map(ep => `
                      <div class="episode-row">
                        <span class="episode-checkbox ${ep.watched ? 'watched' : ''}" onclick="toggleEpisode('${item.id}', '${ep.id}')">
                          ${ep.watched ? '✓' : '○'}
                        </span>
                        <span class="episode-label ${ep.watched ? 'watched' : ''}" onclick="toggleEpisode('${item.id}', '${ep.id}')">
                          E${ep.number || '-'}: ${escapeHtml(ep.name)}
                        </span>
                        <button class="star-btn ${ep.favorite ? 'active' : ''}" title="Favorite Episode" onclick="toggleEpisodeFavorite('${item.id}', '${ep.id}', event)">
                          ${ep.favorite ? '★' : '☆'}
                        </button>
                      </div>
                    `).join('')}
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        return `
          <div class="card-container">
            <div class="card" onclick="toggleShowAccordion('${item.id}')">
              ${item.image ? `<img src="${escapeHtml(item.image)}" class="poster" loading="lazy">` : '<div class="poster"></div>'}
              <div class="info">
                <div class="title">${escapeHtml(item.name)} <span style="font-size:12px; color:#888;">▼</span></div>
                <div class="sub" style="color:#38bdf8;">Next Air Date: ${escapeHtml(item.nextAirDate)}</div>
                <div class="progress-text">
                  ${stats.watched} / ${stats.total} eps (${stats.pct}%) 
                  ${stats.favorites > 0 ? `· <span style="color:#facc15;">★ ${stats.favorites}</span>` : ''}
                </div>
                ${calLink}
              </div>
              <button class="delete-btn" onclick="deleteItem('${item.id}', event)">✕</button>
            </div>
            ${episodesHtml}
          </div>
        `;
      }).join('');
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watchlist, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `watchlist_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackup(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            watchlist = imported;
            save();
            alert('Watchlist restored successfully!');
          } else {
            alert('Invalid backup structure.');
          }
        } catch {
          alert('Could not parse JSON file.');
        }
      };
      if (event.target.files && event.target.files[0]) {
        fileReader.readAsText(event.target.files[0]);
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered', reg))
          .catch(err => console.error('SW Error', err));
      });
    }

    renderDisplay();
  </script>
</body>
</html>
