<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>TrackMyList</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="./manifest.json">
  <script src="./config.js" onerror="console.log('No external config.js detected.')"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    body {
      background-color: #121212;
      color: #fff;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      -webkit-text-size-adjust: 100%;
    }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .top-title-group { display: flex; align-items: baseline; gap: 8px; }
    .top-bar h1 { font-size: 20px; font-weight: bold; }
    .version-badge { color: #38bdf8; font-size: 11px; background: #1a1a1a; padding: 3px 6px; border-radius: 4px; border: 1px solid #333; }
    .top-actions { display: flex; gap: 8px; }

    /* Buttons */
    button { -webkit-appearance: none; appearance: none; cursor: pointer; }
    .btn-action { background: #262626; border: 1px solid #444; color: #eee; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; width: fit-content; display: inline-block; }
    .btn-action:active { background: #383838; }
    .btn-watched { background: #14532d !important; color: #4ade80 !important; border-color: #15803d !important; }
    .btn-reading { background: #0369a1 !important; color: #38bdf8 !important; border-color: #0284c7 !important; }
    .btn-plan { background: #713f12 !important; color: #fde047 !important; border-color: #a16207 !important; }

    /* Top Navigation Tabs */
    .tabs { display: flex; background: #1e1e1e; border-radius: 8px; padding: 4px; margin-bottom: 12px; gap: 4px; }
    .tab { flex: 1; min-height: 42px; text-align: center; background: transparent; border: none; color: #888; font-weight: bold; border-radius: 6px; font-size: 13px; }
    .tab.active { background: #333; color: #fff; }

    /* Media Sub-Tabs (inside My List) */
    .media-subtabs { display: flex; background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 3px; margin-bottom: 10px; gap: 4px; }
    .media-tab { flex: 1; min-height: 36px; text-align: center; background: transparent; border: none; color: #888; font-size: 12px; font-weight: 600; border-radius: 6px; }
    .media-tab.active { background: #2a2a2a; color: #fff; }

    /* Search & Filter Rows */
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; min-height: 44px; padding: 8px 12px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; }
    input[type="text"]:focus { outline: none; border-color: #666; }
    button.btn-search { background: #e50914; color: #fff; border: none; min-height: 44px; padding: 0 18px; border-radius: 8px; font-weight: bold; font-size: 14px; }

    .dropdown { background: #222; border-radius: 8px; margin-bottom: 12px; overflow: hidden; border: 1px solid #333; }
    .drop-item { display: flex; justify-content: space-between; min-height: 48px; padding: 10px 14px; border-bottom: 1px solid #2e2e2e; cursor: pointer; align-items: center; }
    .drop-item:active { background: #2a2a2a; }

    /* Controls Bar */
    .controls-panel { margin-bottom: 12px; }
    .status-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
    .status-pills::-webkit-scrollbar { display: none; }
    .pill { background: #1e1e1e; border: 1px solid #333; color: #888; min-height: 36px; padding: 4px 14px; border-radius: 18px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .pill.active { background: #e50914; border-color: #e50914; color: #fff; }

    .sub-controls { display: flex; gap: 8px; align-items: center; }
    .view-toggle { background: #1e1e1e; border: 1px solid #333; color: #aaa; min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: 13px; }

    /* Cards */
    .card-container { background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; overflow: hidden; border: 1px solid #2a2a2a; }
    .card-main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
    .poster { width: 55px; height: 80px; object-fit: cover; border-radius: 4px; background: #2a2a2a; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 4px; }
    .progress-text { color: #38bdf8; font-size: 12px; font-weight: 500; margin-top: 4px; margin-bottom: 6px; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .tag { background: #2a2a2a; color: #38bdf8; font-size: 11px; padding: 3px 6px; border-radius: 4px; }
    .btn-expand { background: #222; border: 1px solid #444; color: #38bdf8; min-height: 36px; padding: 6px 12px; border-radius: 4px; font-size: 12px; display: inline-block; margin-top: 4px; }
    .btn-cal { background: #0369a1; color: #fff; text-decoration: none; min-height: 34px; padding: 6px 10px; border-radius: 4px; font-size: 12px; display: inline-block; margin-top: 5px; }
    .delete-btn { color: #ff5555; background: none; border: none; font-size: 20px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }

    /* Compact List Layout */
    .compact-mode .card-main { padding: 8px 10px; align-items: center; }
    .compact-mode .poster { width: 36px; height: 50px; }
    .compact-mode .sub, .compact-mode .tags, .compact-mode .btn-cal { display: none; }
    .compact-mode .title { font-size: 14px; margin-bottom: 0; }

    /* Accordion */
    .episodes-panel { background: #161616; border-top: 1px solid #2d2d2d; padding: 8px 12px; }
    .season-block { margin-bottom: 6px; border-bottom: 1px solid #222; }
    .season-block:last-child { border-bottom: none; }
    .season-header { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 6px 4px; cursor: pointer; }
    .season-title-group { display: flex; align-items: center; gap: 8px; }
    .season-title { color: #fbbf24; font-size: 14px; font-weight: bold; }
    .season-indicator { font-size: 12px; color: #777; }
    .season-stats { font-size: 12px; color: #888; }
    .bulk-btn { color: #94a3b8; font-size: 12px; text-decoration: underline; background: none; border: none; min-height: 40px; padding: 0 8px; }
    
    .season-episodes-list { padding: 4px 0 10px 0; }
    .episode-row { display: flex; align-items: center; min-height: 44px; padding: 4px 2px; border-bottom: 1px solid #1c1c1c; font-size: 13px; cursor: pointer; }
    .episode-checkbox { width: 40px; height: 40px; line-height: 40px; text-align: center; color: #888; font-weight: bold; font-size: 18px; user-select: none; flex-shrink: 0; }
    .episode-checkbox.watched { color: #4ade80; }
    .episode-label { flex: 1; margin-left: 6px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 40px; }
    .episode-label.watched { color: #666; text-decoration: line-through; }
    .star-btn { background: none; border: none; font-size: 20px; color: #555; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .star-btn.active { color: #facc15; }
  </style>
</head>
<body>

  <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">

  <div class="top-bar">
    <div class="top-title-group">
      <h1>TrackMyList</h1>
      <span class="version-badge">v5.1</span>
    </div>
    <div class="top-actions">
      <button type="button" class="btn-action" data-action="export">📥 Export</button>
      <button type="button" class="btn-action" data-action="import">📤 Import</button>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-action="tab" data-tab="watchlist">My List</button>
    <button type="button" class="tab" data-action="tab" data-tab="tv">Add TV</button>
    <button type="button" class="tab" data-action="tab" data-tab="movie">Add Movie</button>
    <button type="button" class="tab" data-action="tab" data-tab="book">Add Book</button>
  </div>

  <div id="searchSection" style="display:none;">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search...">
      <button type="button" class="btn-search" data-action="search-btn">Search</button>
    </div>
    <div id="searchResults" class="dropdown" style="display:none;"></div>
  </div>

  <div id="controlsSection" class="controls-panel">
    <div class="media-subtabs">
      <button type="button" class="media-tab active" data-action="media-tab" data-media="tv">📺 TV Shows</button>
      <button type="button" class="media-tab" data-action="media-tab" data-media="movie">🎬 Movies</button>
      <button type="button" class="media-tab" data-action="media-tab" data-media="book">📚 Books</button>
    </div>

    <!-- Static status pills containers -->
    <div class="status-pills" id="pillsTv">
      <button type="button" class="pill active" data-action="filter-pill" data-filter="all">All</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="watching">📺 Watching</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="completed">✓ Finished</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="favorites">⭐ Favorites</button>
    </div>
    <div class="status-pills" id="pillsMovie" style="display:none;">
      <button type="button" class="pill active" data-action="filter-pill" data-filter="all">All</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="to_watch">🍿 To Watch</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="completed">✓ Watched</button>
    </div>
    <div class="status-pills" id="pillsBook" style="display:none;">
      <button type="button" class="pill active" data-action="filter-pill" data-filter="all">All</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="reading">📖 Reading</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="plan">📌 Want to Read</button>
      <button type="button" class="pill" data-action="filter-pill" data-filter="completed">✓ Finished</button>
    </div>

    <div class="sub-controls">
      <input type="text" id="filterInput" placeholder="Filter by title, creator, genre...">
      <button type="button" class="view-toggle" data-action="toggle-view" id="viewToggleBtn">☰ Compact</button>
    </div>
  </div>

  <h3 id="listHeading" style="color:#aaa; font-size:13px; margin-bottom:8px;">Saved Items</h3>
  <div id="itemsContainer"></div>

  <script>
    // 1. Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    const OMDB_KEY = (typeof OMDB_API_KEY !== 'undefined') ? OMDB_API_KEY : "YOUR_OMDB_KEY";

    // 2. Application State
    let currentTab = 'watchlist';
    let currentMediaSubtab = 'tv';
    let currentStatusFilter = 'all';
    let isCompactView = false;
    let expandedShows = {};
    let expandedSeasons = {};
    let currentSearchResults = [];
    let watchlist = [];

    // Robust backward-compatible normalizer
    function normalizeWatchlist(items) {
      if (!Array.isArray(items)) return [];
      return items.map(item => {
        if (!item) return null;
        const mediaType = item.type || (Array.isArray(item.seasons) ? 'tv' : 'movie');

        const norm = {
          id: String(item.id || Math.random()),
          type: mediaType,
          name: item.name || '',
          year: item.year ? String(item.year) : '',
          director: item.director || '',
          actors: item.actors || '',
          author: item.author || '',
          genres: Array.isArray(item.genres) ? item.genres : [],
          image: item.image || '',
          watched: item.watched === true,
          bookStatus: item.bookStatus || (item.watched ? 'completed' : 'plan'),
          nextAirDate: item.nextAirDate || 'TBD',
          nextEpisodeTitle: item.nextEpisodeTitle || '',
          nextAirStamp: item.nextAirStamp || null,
          seasons: []
        };

        if (norm.type === 'tv' && Array.isArray(item.seasons)) {
          norm.seasons = item.seasons.map(s => {
            const rawEps = Array.isArray(s.episodes) ? s.episodes : [];
            const episodes = rawEps.map(ep => ({
              id: String(ep.id || Math.random()),
              name: ep.name || '',
              number: ep.number,
              season: ep.season,
              airdate: ep.airdate || '',
              watched: ep.watched === true,
              favorite: ep.favorite === true
            }));

            let detectedYear = s.year ? String(s.year) : '';
            if (!detectedYear && episodes.length > 0 && episodes[0].airdate && episodes[0].airdate.length >= 4) {
              detectedYear = episodes[0].airdate.slice(0, 4);
            }

            return {
              season: Number(s.season || 1),
              year: detectedYear,
              episodes: episodes
            };
          });
        }
        return norm;
      }).filter(Boolean);
    }

    try {
      const raw = localStorage.getItem('tracklist_items_v2') || localStorage.getItem('tracklist_items') || '[]';
      watchlist = normalizeWatchlist(JSON.parse(raw));
    } catch (e) {
      watchlist = [];
    }

    function appSave() {
      try {
        localStorage.setItem('tracklist_items_v2', JSON.stringify(watchlist));
      } catch (e) {
        console.error("Storage error:", e);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function getStats(seasons) {
      let total = 0, watched = 0, favorites = 0;
      if (!Array.isArray(seasons)) return { total, watched, favorites, pct: 0 };
      seasons.forEach(s => {
        (s.episodes || []).forEach(ep => {
          total++;
          if (ep.watched) watched++;
          if (ep.favorite) favorites++;
        });
      });
      return { total, watched, favorites, pct: total ? Math.round((watched / total) * 100) : 0 };
    }

    // Safely sync CSS visibility without innerHTML
    function syncPillsVisibility() {
      const pTv = document.getElementById('pillsTv');
      const pMovie = document.getElementById('pillsMovie');
      const pBook = document.getElementById('pillsBook');
      if (!pTv || !pMovie || !pBook) return;

      pTv.style.display = currentMediaSubtab === 'tv' ? 'flex' : 'none';
      pMovie.style.display = currentMediaSubtab === 'movie' ? 'flex' : 'none';
      pBook.style.display = currentMediaSubtab === 'book' ? 'flex' : 'none';

      const activeGroup = currentMediaSubtab === 'tv' ? pTv : (currentMediaSubtab === 'movie' ? pMovie : pBook);
      const pills = activeGroup.querySelectorAll('.pill');
      pills.forEach(p => {
        if (p.getAttribute('data-filter') === currentStatusFilter) p.classList.add('active');
        else p.classList.remove('active');
      });
    }

    // 3. Render Engine using secure ES6 Template Literals
    function appRender() {
      syncPillsVisibility();
      const container = document.getElementById('itemsContainer');
      const heading = document.getElementById('listHeading');
      if (!container || !heading) return;

      let itemsToRender = [];

      if (currentTab === 'watchlist') {
        const filterStr = (document.getElementById('filterInput')?.value || '').toLowerCase().trim();
        
        itemsToRender = watchlist.filter(item => {
          if (item.type !== currentMediaSubtab) return false;

          if (currentMediaSubtab === 'tv') {
            const st = getStats(item.seasons);
            if (currentStatusFilter === 'watching' && st.watched >= st.total) return false;
            if (currentStatusFilter === 'completed' && (st.total === 0 || st.watched < st.total)) return false;
            if (currentStatusFilter === 'favorites' && st.favorites === 0) return false;
          } else if (currentMediaSubtab === 'movie') {
            if (currentStatusFilter === 'to_watch' && item.watched) return false;
            if (currentStatusFilter === 'completed' && !item.watched) return false;
          } else if (currentMediaSubtab === 'book') {
            if (currentStatusFilter === 'reading' && item.bookStatus !== 'reading') return false;
            if (currentStatusFilter === 'plan' && item.bookStatus !== 'plan') return false;
            if (currentStatusFilter === 'completed' && item.bookStatus !== 'completed') return false;
          }

          if (!filterStr) return true;
          const matchName = item.name?.toLowerCase().includes(filterStr);
          return matchName ||
                 item.director?.toLowerCase().includes(filterStr) ||
                 item.author?.toLowerCase().includes(filterStr) ||
                 item.actors?.toLowerCase().includes(filterStr) ||
                 (item.genres || []).some(g => g.toLowerCase().includes(filterStr));
        });

        const mediaLabel = currentMediaSubtab === 'tv' ? 'TV Shows' : (currentMediaSubtab === 'movie' ? 'Movies' : 'Books');
        heading.style.display = 'block';
        heading.textContent = `${mediaLabel} (${itemsToRender.length})`;

        if (!itemsToRender.length) {
          container.innerHTML = `<div style="color:#666; font-size:13px; padding:16px 0;">No ${mediaLabel.toLowerCase()} found in this view.</div>`;
          return;
        }
      } else {
        const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
        if (!searchQuery || searchQuery.length < 2) {
          heading.style.display = 'none';
          container.innerHTML = '';
          return;
        }
        itemsToRender = watchlist.filter(item => item.type === currentTab && item.name?.toLowerCase().includes(searchQuery));

        if (!itemsToRender.length) {
          heading.style.display = 'none';
          container.innerHTML = '';
          return;
        }
        heading.style.display = 'block';
        heading.textContent = `Already in List (${itemsToRender.length})`;
      }

      container.className = isCompactView ? 'compact-mode' : '';

      container.innerHTML = itemsToRender.map(item => {
        const sId = item.id;

        if (item.type === 'movie') {
          return `
            <div class="card-container">
              <div class="card-main">
                ${item.image ? `<img src="${escapeHtml(item.image)}" class="poster" loading="lazy">` : `<div class="poster"></div>`}
                <div class="info">
                  <div class="title">${escapeHtml(item.name)} <span style="color:#888; font-size:12px;">(${escapeHtml(item.year)})</span></div>
                  <div class="tags">${(item.genres || []).map(g => `<span class="tag">${escapeHtml(g)}</span>`).join('')}</div>
                  <div class="sub">Dir: ${escapeHtml(item.director)}</div>
                  <div class="sub" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Cast: ${escapeHtml(item.actors)}</div>
                  <button type="button" class="btn-action ${item.watched ? 'btn-watched' : ''}" data-action="toggle-movie" data-id="${sId}">
                    ${item.watched ? '✓ Watched' : '○ Mark as Watched'}
                  </button>
                </div>
                <button type="button" class="delete-btn" data-action="delete" data-id="${sId}">✕</button>
              </div>
            </div>`;
        } 
        else if (item.type === 'book') {
          const statusClass = item.bookStatus === 'completed' ? 'btn-watched' : (item.bookStatus === 'reading' ? 'btn-reading' : 'btn-plan');
          const statusText = item.bookStatus === 'completed' ? '✓ Finished' : (item.bookStatus === 'reading' ? '📖 Reading' : '📌 Want to Read');

          return `
            <div class="card-container">
              <div class="card-main">
                ${item.image ? `<img src="${escapeHtml(item.image)}" class="poster" loading="lazy">` : `<div class="poster"></div>`}
                <div class="info">
                  <div class="title">${escapeHtml(item.name)} <span style="color:#888; font-size:12px;">(${escapeHtml(item.year)})</span></div>
                  <div class="sub" style="color:#38bdf8;">Author: ${escapeHtml(item.author || 'Unknown')}</div>
                  <button type="button" class="btn-action ${statusClass}" data-action="cycle-book" data-id="${sId}">
                    ${statusText} ▾
                  </button>
                </div>
                <button type="button" class="delete-btn" data-action="delete" data-id="${sId}">✕</button>
              </div>
            </div>`;
        } 
        else {
          const stats = getStats(item.seasons);
          const isShowExpanded = Boolean(expandedShows[sId]);
          let calLink = '';
          
          if (item.nextAirStamp) {
            const d = new Date(item.nextAirStamp);
            const iso = d.toISOString().replace(/-|:|\.\d\d\d/g, "");
            const textEnc = encodeURIComponent(`New ${item.name} Episode`);
            const detailsEnc = encodeURIComponent(item.nextEpisodeTitle || 'New Episode Airing');
            calLink = `<a class="btn-cal" target="_blank" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${textEnc}&dates=${iso}/${iso}&details=${detailsEnc}">📅 Calendar</a>`;
          }

          let episodesHtml = '';
          if (isShowExpanded && Array.isArray(item.seasons)) {
            episodesHtml = `<div class="episodes-panel">` + item.seasons.map((s, sIdx) => {
              const sEps = Array.isArray(s.episodes) ? s.episodes : [];
              const sTotal = sEps.length;
              const sWatched = sEps.filter(ep => ep.watched).length;
              const allWatched = sTotal > 0 && sWatched === sTotal;
              const yearLabel = s.year ? ` <span style="color:#888; font-size:12px; font-weight:normal;">(${escapeHtml(s.year)})</span>` : '';

              const key = `${sId}_${s.season}`;
              if (expandedSeasons[key] === undefined) {
                const prevSeasonDone = sIdx > 0 && Array.isArray(item.seasons[sIdx - 1]?.episodes) && 
                                       item.seasons[sIdx - 1].episodes.length > 0 && 
                                       item.seasons[sIdx - 1].episodes.every(e => e.watched);
                expandedSeasons[key] = (sWatched < sTotal) && (sIdx === 0 || prevSeasonDone);
              }
              const isSeasonOpen = Boolean(expandedSeasons[key]);

              let epsList = '';
              if (isSeasonOpen && sEps.length > 0) {
                epsList = `<div class="season-episodes-list">` + sEps.map(ep => `
                  <div class="episode-row" data-action="toggle-ep" data-show="${sId}" data-ep="${ep.id}">
                    <span class="episode-checkbox ${ep.watched ? 'watched' : ''}">${ep.watched ? '✓' : '○'}</span>
                    <span class="episode-label ${ep.watched ? 'watched' : ''}">E${ep.number || '-'}: ${escapeHtml(ep.name)}</span>
                    <button type="button" class="star-btn ${ep.favorite ? 'active' : ''}" data-action="fav-ep" data-show="${sId}" data-ep="${ep.id}">
                      ${ep.favorite ? '★' : '☆'}
                    </button>
                  </div>
                `).join('') + `</div>`;
              }

              return `
                <div class="season-block">
                  <div class="season-header" data-action="toggle-season" data-show="${sId}" data-season="${s.season}">
                    <div class="season-title-group" style="pointer-events:none;">
                      <span class="season-indicator">${isSeasonOpen ? '▼' : '▶'}</span>
                      <span class="season-title">Season ${s.season}${yearLabel}</span>
                      <span class="season-stats">(${sWatched}/${sTotal})</span>
                    </div>
                    <button type="button" class="bulk-btn" data-action="bulk-season" data-show="${sId}" data-season="${s.season}" data-mark="${!allWatched}">
                      ${allWatched ? 'Unmark Season' : 'Watch Season'}
                    </button>
                  </div>
                  ${epsList}
                </div>`;
            }).join('') + `</div>`;
          }

          return `
            <div class="card-container">
              <div class="card-main">
                ${item.image ? `<img src="${escapeHtml(item.image)}" class="poster" loading="lazy">` : `<div class="poster"></div>`}
                <div class="info">
                  <div class="title">${escapeHtml(item.name)}</div>
                  <div class="sub" style="color:#38bdf8;">Next Air: ${escapeHtml(item.nextAirDate)}</div>
                  <div class="progress-text">
                    ${stats.watched} / ${stats.total} eps (${stats.pct}%) 
                    ${stats.favorites > 0 ? `· <span style="color:#facc15;">★ ${stats.favorites}</span>` : ''}
                  </div>
                  <button type="button" class="btn-expand" data-action="toggle-show" data-id="${sId}">
                    ${isShowExpanded ? '▲ Hide Episodes' : '▼ View Episodes'}
                  </button>
                  ${calLink}
                </div>
                <button type="button" class="delete-btn" data-action="delete" data-id="${sId}">✕</button>
              </div>
              ${episodesHtml}
            </div>`;
        }
      }).join('');
    }

    // 4. Guaranteed Single Event Delegation Bus with setTimeout Offloading
    document.addEventListener('click', e => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');

      if (action === 'tab') {
        currentTab = target.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        target.classList.add('active');

        const sSec = document.getElementById('searchSection');
        const cSec = document.getElementById('controlsSection');
        const sInput = document.getElementById('searchInput');
        const resBox = document.getElementById('searchResults');

        if (sInput) sInput.value = '';
        if (resBox) { resBox.innerHTML = ''; resBox.style.display = 'none'; }
        currentSearchResults = [];

        if (currentTab === 'watchlist') {
          if (sSec) sSec.style.display = 'none';
          if (cSec) cSec.style.display = 'block';
        } else {
          if (sSec) sSec.style.display = 'block';
          if (cSec) cSec.style.display = 'none';
          const pLabel = currentTab === 'tv' ? 'TV shows' : (currentTab === 'movie' ? 'movies' : 'books');
          if (sInput) { sInput.placeholder = `Search ${pLabel} online...`; sInput.focus(); }
        }
        setTimeout(appRender, 0);
      }
      else if (action === 'media-tab') {
        currentMediaSubtab = target.getAttribute('data-media');
        currentStatusFilter = 'all';
        document.querySelectorAll('.media-tab').forEach(m => m.classList.remove('active'));
        target.classList.add('active');
        setTimeout(appRender, 0);
      }
      else if (action === 'filter-pill') {
        currentStatusFilter = target.getAttribute('data-filter');
        setTimeout(appRender, 0);
      }
      else if (action === 'toggle-view') {
        isCompactView = !isCompactView;
        const tb = document.getElementById('viewToggleBtn');
        if (tb) tb.textContent = isCompactView ? '▤ Detailed' : '☰ Compact';
        setTimeout(appRender, 0);
      }
      else if (action === 'toggle-show') {
        const id = String(target.getAttribute('data-id'));
        expandedShows[id] = !expandedShows[id];
        setTimeout(appRender, 0);
      }
      else if (action === 'toggle-season') {
        if (e.target.closest('.bulk-btn')) return;
        const sKey = String(target.getAttribute('data-show')) + '_' + target.getAttribute('data-season');
        expandedSeasons[sKey] = !expandedSeasons[sKey];
        setTimeout(appRender, 0);
      }
      else if (action === 'toggle-ep') {
        if (e.target.closest('.star-btn')) return; // Avoid double triggering
        const shId = String(target.getAttribute('data-show'));
        const epId = String(target.getAttribute('data-ep'));
        watchlist.forEach(item => {
          if (item.id === shId && Array.isArray(item.seasons)) {
            item.seasons.forEach(s => {
              (s.episodes || []).forEach(ep => { if (ep.id === epId) ep.watched = !ep.watched; });
            });
          }
        });
        appSave(); setTimeout(appRender, 0);
      }
      else if (action === 'fav-ep') {
        const shId = String(target.getAttribute('data-show'));
        const epId = String(target.getAttribute('data-ep'));
        watchlist.forEach(item => {
          if (item.id === shId && Array.isArray(item.seasons)) {
            item.seasons.forEach(s => {
              (s.episodes || []).forEach(ep => { if (ep.id === epId) ep.favorite = !ep.favorite; });
            });
          }
        });
        appSave(); setTimeout(appRender, 0);
      }
      else if (action === 'bulk-season') {
        const shId = String(target.getAttribute('data-show'));
        const sNum = Number(target.getAttribute('data-season'));
        const mark = target.getAttribute('data-mark') === 'true';
        watchlist.forEach(item => {
          if (item.id === shId && Array.isArray(item.seasons)) {
            item.seasons.forEach(s => {
              if (s.season === sNum) { (s.episodes || []).forEach(ep => { ep.watched = mark; }); }
            });
          }
        });
        appSave(); setTimeout(appRender, 0);
      }
      else if (action === 'toggle-movie') {
        const mId = String(target.getAttribute('data-id'));
        watchlist.forEach(item => { if (item.id === mId) item.watched = !item.watched; });
        appSave(); setTimeout(appRender, 0);
      }
      else if (action === 'cycle-book') {
        const bId = String(target.getAttribute('data-id'));
        watchlist.forEach(item => {
          if (item.id === bId) {
            if (item.bookStatus === 'plan') item.bookStatus = 'reading';
            else if (item.bookStatus === 'reading') item.bookStatus = 'completed';
            else item.bookStatus = 'plan';
          }
        });
        appSave(); setTimeout(appRender, 0);
      }
      else if (action === 'delete') {
        if (confirm('Remove this title from your list?')) {
          const dId = String(target.getAttribute('data-id'));
          watchlist = watchlist.filter(w => w.id !== dId);
          appSave(); setTimeout(appRender, 0);
        }
      }
      else if (action === 'add-result') {
        addByIndex(Number(target.getAttribute('data-idx')));
      }
      else if (action === 'export') {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watchlist, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `watchlist_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(a); a.click(); a.remove();
      }
      else if (action === 'import') {
        const fi = document.getElementById('importFileInput');
        if (fi) { fi.value = ''; fi.click(); }
      }
      else if (action === 'search-btn') {
        executeSearch();
      }
    });

    document.getElementById('filterInput')?.addEventListener('input', () => setTimeout(appRender, 0));

    document.getElementById('importFileInput')?.addEventListener('change', e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            watchlist = normalizeWatchlist(parsed);
            appSave();
            alert(`Watchlist restored successfully! Loaded ${watchlist.length} titles.`);
            setTimeout(appRender, 0);
          } else alert('Invalid backup structure: expected a JSON array.');
        } catch (err) { alert('Could not parse JSON file.'); }
      };
      reader.readAsText(file);
    });

    document.getElementById('searchInput')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') executeSearch();
    });

    async function executeSearch() {
      const q = (document.getElementById('searchInput')?.value || '').trim();
      if (!q) { appRender(); return; }

      const resBox = document.getElementById('searchResults');
      resBox.innerHTML = '<div style="padding:12px; color:#888;">Searching...</div>';
      resBox.style.display = 'block';

      try {
        if (currentTab === 'tv') {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          currentSearchResults = data.map(d => ({ id: String(d.show.id), name: d.show.name, type: 'tv' }));
          renderDropdown(currentSearchResults);
        } else if (currentTab === 'book') {
          const bRes = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8`);
          const bData = await bRes.json();
          if (bData.docs?.length > 0) {
            currentSearchResults = bData.docs.map(b => ({
              id: b.key ? b.key.replace('/works/', '') : String(Math.random()),
              name: `${b.title}${b.first_publish_year ? ` (${b.first_publish_year})` : ''}`,
              rawTitle: b.title,
              author: b.author_name?.join(', ') || 'Unknown Author',
              year: b.first_publish_year ? String(b.first_publish_year) : '',
              image: b.cover_i ? `https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg` : '',
              type: 'book'
            }));
            renderDropdown(currentSearchResults);
          } else resBox.innerHTML = '<div style="padding:12px; color:#888;">No books found.</div>';
        } else {
          const cleanQ = q.trim();
          if (/^tt\d+/i.test(cleanQ)) {
            const dRes = await fetch(`https://www.omdbapi.com/?i=${encodeURIComponent(cleanQ)}&apikey=${OMDB_KEY}`);
            const dData = await dRes.json();
            if (dData.Response === 'True') {
              currentSearchResults = [{ id: String(dData.imdbID), name: `${dData.Title} (${dData.Year || 'N/A'})`, rawTitle: dData.Title, type: 'movie' }];
              renderDropdown(currentSearchResults); return;
            }
          }

          let titleQ = cleanQ, yearQ = '';
          const yMatch = cleanQ.match(/\b(19\d\d|20\d\d)\b/);
          if (yMatch) { yearQ = `&y=${yMatch[0]}`; titleQ = cleanQ.replace(yMatch[0], '').trim(); }

          let mRes = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(titleQ)}${yearQ}&type=movie&apikey=${OMDB_KEY}`);
          let mData = await mRes.json();

          if (mData.Response !== 'True' && yearQ) {
            mRes = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(titleQ)}&type=movie&apikey=${OMDB_KEY}`);
            mData = await mRes.json();
          }

          if (mData.Response !== 'True') {
            mRes = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(titleQ)}&type=movie&apikey=${OMDB_KEY}`);
            const eData = await mRes.json();
            if (eData.Response === 'True') mData = { Response: 'True', Search: [eData] };
          }

          if (mData.Response === 'True' && Array.isArray(mData.Search)) {
            currentSearchResults = mData.Search.map(m => ({ id: String(m.imdbID), name: `${m.Title} (${m.Year || 'N/A'})`, rawTitle: m.Title, type: 'movie' }));
            renderDropdown(currentSearchResults);
          } else resBox.innerHTML = `<div style="padding:12px; color:#ff5555;">${mData.Error || 'No results found on OMDb.'}</div>`;
        }
      } catch (err) { resBox.innerHTML = '<div style="padding:12px; color:#ff5555;">Search failed. Verify network.</div>'; }
      setTimeout(appRender, 0);
    }

    function renderDropdown(items) {
      const box = document.getElementById('searchResults');
      if (!items.length) { box.innerHTML = '<div style="padding:12px; color:#888;">No results found.</div>'; return; }
      box.innerHTML = items.slice(0, 8).map((it, idx) => `
        <div class="drop-item" data-action="add-result" data-idx="${idx}">
          <span>${escapeHtml(it.name)}</span>
          <span style="color:#4ade80; font-weight:bold;">+ Add</span>
        </div>
      `).join('');
    }

    async function addByIndex(index) {
      const item = currentSearchResults[index];
      if (!item) return;
      if (watchlist.some(w => w.id === item.id)) { alert('Already in your list!'); return; }

      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('searchInput').value = '';

      try {
        if (item.type === 'movie') {
          const res = await fetch(`https://www.omdbapi.com/?i=${item.id}&plot=short&apikey=${OMDB_KEY}`);
          const d = await res.json();
          watchlist.push({ id: String(item.id), type: 'movie', name: d.Title || item.rawTitle, year: d.Year || '', director: d.Director || 'N/A', actors: d.Actors || 'N/A', genres: d.Genre ? d.Genre.split(', ') : [], image: d.Poster && d.Poster !== 'N/A' ? d.Poster : '', watched: false });
        } else if (item.type === 'book') {
          watchlist.push({ id: String(item.id), type: 'book', name: item.rawTitle || item.name, author: item.author || 'Unknown', year: item.year || '', image: item.image || '', bookStatus: 'plan', watched: false });
        } else {
          const epRes = await fetch(`https://api.tvmaze.com/shows/${item.id}/episodes`);
          const rawEpisodes = await epRes.json();
          const seasonsMap = {};
          rawEpisodes.forEach(ep => {
            if (!seasonsMap[ep.season]) seasonsMap[ep.season] = { season: ep.season, year: ep.airdate?.slice(0, 4) || '', episodes: [] };
            seasonsMap[ep.season].episodes.push({ id: String(ep.id), name: ep.name || `Episode ${ep.number}`, number: ep.number, season: ep.season, airdate: ep.airdate || '', watched: false, favorite: false });
          });
          watchlist.push({ id: String(item.id), type: 'tv', name: item.name, image: rawEpisodes[0]?.image?.medium || '', nextAirDate: 'TBD', nextEpisodeTitle: '', nextAirStamp: null, seasons: Object.values(seasonsMap) });
        }

        appSave();
        currentMediaSubtab = item.type;
        currentTab = 'watchlist';

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="watchlist"]')?.classList.add('active');
        document.querySelectorAll('.media-tab').forEach(m => m.classList.remove('active'));
        document.querySelector(`[data-media="${item.type}"]`)?.classList.add('active');

        document.getElementById('searchSection').style.display = 'none';
        document.getElementById('controlsSection').style.display = 'block';
        setTimeout(appRender, 0);
      } catch (e) { alert('Could not fetch details.'); }
    }

    setTimeout(appRender, 0);
  </script>
</body>
</html>
