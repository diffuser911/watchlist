<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackList</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22TrackList%22%2C%22short_name%22%3A%22TrackList%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23121212%22%2C%22theme_color%22%3A%22%23121212%22%7D">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 16px; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    .tabs { display: flex; background: #1e1e1e; border-radius: 8px; padding: 3px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 8px; text-align: center; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .tab.active { background: #333; color: #fff; }
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; }
    button.btn-search { background: #e50914; color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .dropdown { background: #222; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .drop-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; cursor: pointer; align-items: center; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; }
    .poster { width: 55px; height: 80px; object-fit: cover; border-radius: 4px; }
    .info { flex: 1; }
    .title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 6px; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .tag { background: #2a2a2a; color: #38bdf8; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .btn-action { background: #262626; border: none; color: #aaa; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .btn-watched { background: #14532d; color: #4ade80; }
    .btn-cal { background: #0369a1; color: #fff; text-decoration: none; padding: 3px 6px; border-radius: 4px; font-size: 11px; display: inline-block; margin-top: 4px; }
    .delete-btn { color: #ff5555; background: none; border: none; font-size: 18px; cursor: pointer; height: fit-content; }
    .filter-box { background: #1a1a1a; padding: 8px; border-radius: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <h1>TrackList</h1>
  
  <div class="tabs">
    <button class="tab active" id="tab-tv" onclick="switchMedia('tv')">TV Shows</button>
    <button class="tab" id="tab-movie" onclick="switchMedia('movie')">Movies</button>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search TV shows online...">
    <button class="btn-search" onclick="searchOnline()">Search</button>
  </div>

  <div id="searchResults" class="dropdown" style="display:none;"></div>

  <div class="filter-box">
    <input type="text" id="filterInput" placeholder="Filter saved movies by genre/director/actor..." oninput="renderWatchlist()">
  </div>

  <h3 style="color:#aaa; font-size:14px; margin-bottom:8px;">My Saved Items</h3>
  <div id="watchlistContainer"></div>

  <script>
    const OMDB_API_KEY = "9f85df42"; // Insert OMDb key if testing movies
    let currentType = 'tv';
    let watchlist = JSON.parse(localStorage.getItem('tracklist_items') || '[]');

    function save() {
      localStorage.setItem('tracklist_items', JSON.stringify(watchlist));
      renderWatchlist();
    }

    function switchMedia(type) {
      currentType = type;
      document.getElementById('tab-tv').className = type === 'tv' ? 'tab active' : 'tab';
      document.getElementById('tab-movie').className = type === 'movie' ? 'tab active' : 'tab';
      document.getElementById('searchInput').placeholder = `Search ${type === 'tv' ? 'TV shows' : 'movies'} online...`;
      document.getElementById('searchResults').style.display = 'none';
    }

    async function searchOnline() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const resBox = document.getElementById('searchResults');
      resBox.innerHTML = '<div style="padding:10px; color:#888;">Searching...</div>';
      resBox.style.display = 'block';

      if (currentType === 'tv') {
        const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderDropdown(data.map(d => ({ id: d.show.id, name: d.show.name, type: 'tv' })));
      } else {
        const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&type=movie&apikey=${OMDB_API_KEY}`);
        const data = await res.json();
        if (data.Response === 'True') {
          renderDropdown(data.Search.map(m => ({ id: m.imdbID, name: `${m.Title} (${m.Year})`, rawTitle: m.Title, type: 'movie' })));
        } else {
          resBox.innerHTML = '<div style="padding:10px; color:#888;">No results found.</div>';
        }
      }
    }

    function renderDropdown(items) {
      const box = document.getElementById('searchResults');
      box.innerHTML = items.slice(0, 5).map(item => `
        <div class="drop-item" onclick='addItem(${JSON.stringify(item)})'>
          <span>${item.name}</span>
          <span style="color:#4ade80; font-weight:bold;">+ Add</span>
        </div>
      `).join('');
    }

    async function addItem(item) {
      if (watchlist.some(w => w.id === item.id)) return alert('Already in list');
      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('searchInput').value = '';

      if (item.type === 'movie') {
        const res = await fetch(`https://www.omdbapi.com/?i=${item.id}&plot=short&apikey=${OMDB_API_KEY}`);
        const d = await res.json();
        watchlist.push({
          id: item.id,
          type: 'movie',
          name: d.Title,
          year: d.Year,
          director: d.Director,
          actors: d.Actors,
          genres: d.Genre ? d.Genre.split(', ') : [],
          image: d.Poster !== 'N/A' ? d.Poster : '',
          watched: false
        });
      } else {
        // TV Show details and next air date
        const res = await fetch(`https://api.tvmaze.com/shows/${item.id}?embed=nextepisode`);
        const d = await res.json();
        const nextEp = d._embedded?.nextepisode;
        watchlist.push({
          id: item.id,
          type: 'tv',
          name: d.name,
          image: d.image?.medium || '',
          nextAirDate: nextEp ? nextEp.airdate : 'TBD',
          nextEpisodeTitle: nextEp ? nextEp.name : '',
          nextAirStamp: nextEp ? nextEp.airstamp : null
        });
      }
      save();
    }

    function toggleWatched(id) {
      watchlist = watchlist.map(item => item.id === id ? { ...item, watched: !item.watched } : item);
      save();
    }

    function deleteItem(id) {
      watchlist = watchlist.filter(w => w.id !== id);
      save();
    }

    function renderWatchlist() {
      const filter = document.getElementById('filterInput').value.toLowerCase().trim();
      const container = document.getElementById('watchlistContainer');
      
      const filtered = watchlist.filter(item => {
        if (!filter) return true;
        if (item.type === 'tv') return item.name.toLowerCase().includes(filter);
        return item.name.toLowerCase().includes(filter) ||
               item.director?.toLowerCase().includes(filter) ||
               item.actors?.toLowerCase().includes(filter) ||
               item.genres?.some(g => g.toLowerCase().includes(filter));
      });

      if (!filtered.length) {
        container.innerHTML = '<div style="color:#666; font-size:13px;">No items match.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        if (item.type === 'movie') {
          return `
            <div class="card">
              ${item.image ? `<img src="${item.image}" class="poster">` : ''}
              <div class="info">
                <div class="title">${item.name} (${item.year})</div>
                <div class="tags">${item.genres.map(g => `<span class="tag">${g}</span>`).join('')}</div>
                <div class="sub">Dir: ${item.director}</div>
                <div class="sub" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Cast: ${item.actors}</div>
                <button class="btn-action ${item.watched ? 'btn-watched' : ''}" onclick="toggleWatched('${item.id}')">
                  ${item.watched ? '✓ Watched' : '○ Mark Watched'}
                </button>
              </div>
              <button class="delete-btn" onclick="deleteItem('${item.id}')">✕</button>
            </div>
          `;
        } else {
          // Generate Google Calendar alert link for TV episode airdate
          let calLink = '';
          if (item.nextAirStamp) {
            const d = new Date(item.nextAirStamp);
            const iso = d.toISOString().replace(/-|:|\.\d\d\d/g, "");
            calLink = `<a class="btn-cal" target="_blank" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('New ' + item.name + ' Episode')}&dates=${iso}/${iso}&details=${encodeURIComponent(item.nextEpisodeTitle || 'New Episode Airing')}">📅 Add Alert to Calendar</a>`;
          }

          return `
            <div class="card">
              ${item.image ? `<img src="${item.image}" class="poster">` : ''}
              <div class="info">
                <div class="title">${item.name}</div>
                <div class="sub" style="color:#38bdf8;">Next Air Date: ${item.nextAirDate}</div>
                ${calLink}
              </div>
              <button class="delete-btn" onclick="deleteItem('${item.id}')">✕</button>
            </div>
          `;
        }
      }).join('');
    }

    // Register basic service worker to enable "Install as App" on Android Chrome
    if ('serviceWorker' in navigator) {
      const swBlob = new Blob([`self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob));
    }

    renderWatchlist();
  </script>
</body>
</html>
